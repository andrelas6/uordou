name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Para o teste que garante que os dias já jogados não mudaram em relação à base.
      - run: git fetch --depth=1 origin ${{ github.base_ref }}
      - run: npm run typecheck
      - run: npm test
        env:
          BASE_REF: origin/${{ github.base_ref }}
      - run: npm run build
